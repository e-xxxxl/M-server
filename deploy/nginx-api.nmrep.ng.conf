# nginx in front of the NMREP API. Installed as /etc/nginx/sites-available/api.nmrep.ng
# and enabled with a link in /etc/nginx/sites-enabled/.
#
# It starts as a plain HTTP site. Running `certbot --nginx -d api.nmrep.ng` then gets a free HTTPS certificate
# and edits this file for you (adds the HTTPS server and redirects HTTP to it).

# A gentle limit per visitor as a first line of defence. The API has its own stricter limits for logins and sign-ups.
limit_req_zone $binary_remote_addr zone=nmrep_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=nmrep_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name api.nmrep.ng;

    # Requests to the API are small JSON bodies. The API itself refuses anything over 20 KB.
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # The API sets its own security headers (helmet). Do not repeat them here.

    location / {
        limit_req zone=nmrep_api burst=40 nodelay;
        limit_req_status 429;
        limit_conn_status 429;
        limit_conn nmrep_conn 30;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Tell the API the real visitor address and that the visitor used HTTPS (TRUST_PROXY=1 in .env).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # Keep noise out of the log.
    location = /favicon.ico { access_log off; log_not_found off; return 204; }
}
